<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeremy</title>
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #202124;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
    }

    /* Mobile Frame Container */
    .site-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: #ffffff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      position: relative;
    }

    /* Top Navigation Bar */
    .nav-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
      color: #ffffff;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
    }
    .site-title-handwritten {
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      font-size: 22px;
      font-weight: bold;
    }

    /* Hero Header Section */
    .hero {
      position: relative;
      height: 240px;
      background: #3a3f47;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    /* Placeholder graphic representing the globe/stars background */
    .hero-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.6;
    }
    .hero-title {
      position: relative;
      z-index: 2;
      color: #ffffff;
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 1px;
    }

    /* Content Area */
    .content {
      padding: 32px 24px;
    }
    .main-heading {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      color: #202124;
      margin-bottom: 24px;
    }

    /* Image Carousel Component */
    .carousel {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #3a3f47;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .carousel-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
    }
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
    }
    .carousel-btn.left { left: 12px; }
    .carousel-btn.right { right: 12px; }

    /* Carousel Navigation Dots */
    .dots-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 32px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #cccccc;
    }
    .dot.active {
      background-color: #3b719f;
    }

    /* Footer Section */
    .footer {
      background-color: #3b719f;
      color: #ffffff;
      padding: 28px 24px 48px 24px;
      position: relative;
    }
    .footer-text {
      font-size: 26px;
      font-weight: 400;
      line-height: 1.3;
    }
    .info-btn {
      position: absolute;
      bottom: 12px;
      left: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.3);
      border: none;
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="site-container">
    <div class="nav-bar">
      <div class="nav-left">
        <button class="icon-btn">&#9776;</button>
        <span class="site-title-handwritten">Jeremy</span>
      </div>
      <button class="icon-btn">&#128093;</button>
    </div>

    <div class="hero">
      <h1 class="hero-title">Jeremy</h1>
    </div>

    <div class="content">
      <h2 class="main-heading">Explorer the adventures and fun in Jeremy</h2>

      <div class="carousel">
        <button class="carousel-btn left">&#10094;</button>
        <button class="carousel-btn right">&#10095;</button>
      </div>

      <div class="dots-container">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <div class="footer">
      <p class="footer-text">Jeremy By Joe the lava boy LLC™</p>
      <button class="info-btn">i</button>
    </div>
  </div>

</body>
</html>
